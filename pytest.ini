[pytest]
# Marcadores declarados: sem isso o pytest avisa "Unknown mark" a cada execução.
markers =
    slow: teste que leva mais de alguns segundos (ex.: população replicada 10x)

# Onde a suíte vive, para `pytest -q` sem argumentos não varrer `dados/`,
# `ML/modelos/` nem a pasta de resultados em busca de testes.
testpaths =
    ingestao/tests
    ETL/tests
    DB/tests
    ds_toolkit/tests
    ML/analise_sobrevivencia/tests
    ML/series_temporais/tests
    backend/tests
